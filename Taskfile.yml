version: '3'

# SemEmbed - Containerized Development Workflow
# All tasks use Docker to avoid requiring local Rust installation

vars:
  IMAGE_NAME: semstreams-semembed
  CONTAINER_NAME: semembed-dev
  PORT: 8081

tasks:
  # Build tasks
  build:
    desc: Build Docker image
    cmds:
      - echo "🔨 Building semembed Docker image..."
      - docker build -t {{.IMAGE_NAME}}:latest .
      - 'echo "✅ Image built: {{.IMAGE_NAME}}:latest"'

  build:fast:
    desc: Build Docker image with buildkit cache
    cmds:
      - echo "🔨 Building semembed with BuildKit cache..."
      - DOCKER_BUILDKIT=1 docker build --cache-from {{.IMAGE_NAME}}:latest -t {{.IMAGE_NAME}}:latest .
      - 'echo "✅ Image built: {{.IMAGE_NAME}}:latest"'

  build:no-cache:
    desc: Build Docker image without cache
    cmds:
      - echo "🔨 Building semembed without cache..."
      - docker build --no-cache -t {{.IMAGE_NAME}}:latest .
      - 'echo "✅ Image built: {{.IMAGE_NAME}}:latest"'

  # Run tasks
  run:
    desc: Run semembed service in Docker
    deps: [build]
    cmds:
      - docker rm -f {{.CONTAINER_NAME}} 2>/dev/null || true
      - |
        docker run -d \
          --name {{.CONTAINER_NAME}} \
          -p {{.PORT}}:{{.PORT}} \
          -e SEMEMBED_MODEL=Snowflake/snowflake-arctic-embed-s \
          -e SEMEMBED_PORT={{.PORT}} \
          -e RUST_LOG=info \
          -v semembed-cache:/home/semembed/.cache/fastembed \
          {{.IMAGE_NAME}}:latest
      - echo "✅ Service running at http://localhost:{{.PORT}}"
      - 'echo "📊 Health: curl http://localhost:{{.PORT}}/health"'
      - 'echo "📝 Logs: task logs"'

  run:fg:
    desc: Run semembed in foreground (see logs)
    deps: [build]
    cmds:
      - docker rm -f {{.CONTAINER_NAME}} 2>/dev/null || true
      - |
        docker run --rm \
          --name {{.CONTAINER_NAME}} \
          -p {{.PORT}}:{{.PORT}} \
          -e SEMEMBED_MODEL=Snowflake/snowflake-arctic-embed-s \
          -e SEMEMBED_PORT={{.PORT}} \
          -e RUST_LOG=info \
          -v semembed-cache:/home/semembed/.cache/fastembed \
          {{.IMAGE_NAME}}:latest

  run:arctic-xs:
    desc: Run with snowflake-arctic-embed-xs (22M params, smallest/fastest)
    deps: [build]
    cmds:
      - docker rm -f {{.CONTAINER_NAME}} 2>/dev/null || true
      - |
        docker run -d \
          --name {{.CONTAINER_NAME}} \
          -p {{.PORT}}:{{.PORT}} \
          -e SEMEMBED_MODEL=Snowflake/snowflake-arctic-embed-xs \
          -e SEMEMBED_PORT={{.PORT}} \
          -e RUST_LOG=info \
          -v semembed-cache:/home/semembed/.cache/fastembed \
          {{.IMAGE_NAME}}:latest
      - echo "✅ Service running with snowflake-arctic-embed-xs model"

  run:arctic-m:
    desc: Run with snowflake-arctic-embed-m (110M params, higher quality)
    deps: [build]
    cmds:
      - docker rm -f {{.CONTAINER_NAME}} 2>/dev/null || true
      - |
        docker run -d \
          --name {{.CONTAINER_NAME}} \
          -p {{.PORT}}:{{.PORT}} \
          -e SEMEMBED_MODEL=Snowflake/snowflake-arctic-embed-m \
          -e SEMEMBED_PORT={{.PORT}} \
          -e RUST_LOG=info \
          -v semembed-cache:/home/semembed/.cache/fastembed \
          {{.IMAGE_NAME}}:latest
      - echo "✅ Service running with snowflake-arctic-embed-m model"

  run:bge-small:
    desc: Run with bge-small-en-v1.5 (prior default, kept for backwards compat)
    deps: [build]
    cmds:
      - docker rm -f {{.CONTAINER_NAME}} 2>/dev/null || true
      - |
        docker run -d \
          --name {{.CONTAINER_NAME}} \
          -p {{.PORT}}:{{.PORT}} \
          -e SEMEMBED_MODEL=BAAI/bge-small-en-v1.5 \
          -e SEMEMBED_PORT={{.PORT}} \
          -e RUST_LOG=info \
          -v semembed-cache:/home/semembed/.cache/fastembed \
          {{.IMAGE_NAME}}:latest
      - echo "✅ Service running with bge-small-en-v1.5 model"

  # Test tasks
  test:health:
    desc: Test health endpoint
    cmds:
      - echo "🧪 Testing health endpoint..."
      - curl -f http://localhost:{{.PORT}}/health || (echo "❌ Health check failed" && exit 1)
      - echo "✅ Health check passed"

  test:embed:
    desc: Test embeddings endpoint (OpenAI-compatible)
    cmds:
      - echo "🧪 Testing embeddings..."
      - |
        curl -X POST http://localhost:{{.PORT}}/v1/embeddings \
          -H "Content-Type: application/json" \
          -d '{
            "input": "This is a test sentence for embedding",
            "model": "Snowflake/snowflake-arctic-embed-s"
          }' || (echo "❌ Embeddings test failed" && exit 1)
      - echo ""
      - echo "✅ Embeddings test passed"

  test:batch:
    desc: Test batch embeddings
    cmds:
      - echo "🧪 Testing batch embeddings..."
      - |
        curl -X POST http://localhost:{{.PORT}}/v1/embeddings \
          -H "Content-Type: application/json" \
          -d '{
            "input": ["First sentence", "Second sentence", "Third sentence"],
            "model": "Snowflake/snowflake-arctic-embed-s"
          }' || (echo "❌ Batch embeddings test failed" && exit 1)
      - echo ""
      - echo "✅ Batch embeddings test passed"

  test:models:
    desc: Test models endpoint
    cmds:
      - echo "🧪 Testing models endpoint..."
      - curl -f http://localhost:{{.PORT}}/models || (echo "❌ Models endpoint test failed" && exit 1)
      - echo ""
      - echo "✅ Models endpoint test passed"

  test:query:
    desc: Test query prefix handling (input_type=query)
    cmds:
      - echo "🧪 Testing query prefix..."
      - |
        response=$(curl -sf -X POST http://localhost:{{.PORT}}/v1/embeddings \
          -H "Content-Type: application/json" \
          -d '{
            "input": "how do I restart the ingest worker",
            "input_type": "query"
          }')
        echo "$response" | grep -q '"prefix_applied":true' || (echo "❌ Expected prefix_applied:true" && exit 1)
      - echo "✅ Query prefix test passed"

  test:truncation:
    desc: Test truncation reporting and metrics
    cmds:
      - echo "🧪 Testing truncation detection..."
      - |
        long_text=$(python3 -c 'print(" ".join(f"section_{i} alpha beta gamma delta" for i in range(200)))')
        response=$(curl -sf -X POST http://localhost:{{.PORT}}/v1/embeddings \
          -H "Content-Type: application/json" \
          -d "{\"input\": [\"short text\", \"$long_text\"]}")
        echo "$response" | grep -q '"truncated":true' || (echo "❌ Expected truncated:true on long input" && exit 1)
        curl -sf http://localhost:{{.PORT}}/metrics | grep -q 'semembed_inputs_truncated_total' || (echo "❌ Missing truncation metric" && exit 1)
      - echo "✅ Truncation test passed"

  test:concurrency:
    desc: Test mixed-length sub-batching order, concurrent micro-batching, and responsive /health
    cmds:
      - echo "🧪 Testing mixed-length sub-batching and concurrent micro-batching..."
      - |
        python3 - <<'PY'
        import concurrent.futures, json, math, time, urllib.request

        def post_embed(payload):
            req = urllib.request.Request(
                "http://localhost:{{.PORT}}/v1/embeddings",
                data=json.dumps(payload).encode(),
                headers={"Content-Type": "application/json"},
            )
            with urllib.request.urlopen(req, timeout=60) as resp:
                return json.loads(resp.read())

        def cosine(a, b):
            dot = sum(x * y for x, y in zip(a, b))
            return dot / (math.sqrt(sum(x * x for x in a)) * math.sqrt(sum(y * y for y in b)))

        long_a = " ".join(f"alpha_doc_{i} routing consensus raft quorum" for i in range(180))
        short_b = "quick status check"
        long_c = " ".join(f"beta_doc_{i} storage compaction wal snapshot" for i in range(180))
        short_d = "restart graph index worker"
        items = [long_a, short_b, long_c, short_d]

        singles = [post_embed({"input": t})["data"][0]["embedding"] for t in items]
        batched = post_embed({"input": items})
        assert [d["index"] for d in batched["data"]] == [0, 1, 2, 3]
        assert batched["data"][0].get("truncated") is True and "truncated" not in batched["data"][1]
        for s, entry in zip(singles, batched["data"]):
            assert cosine(s, entry["embedding"]) > 0.99999

        with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
            futs = [
                pool.submit(
                    post_embed,
                    {"input": f"concurrent item {i}", "input_type": "query" if i % 2 == 0 else "document"},
                )
                for i in range(8)
            ]
            t0 = time.perf_counter()
            health = json.loads(urllib.request.urlopen("http://localhost:{{.PORT}}/health", timeout=3).read())
            dt_ms = (time.perf_counter() - t0) * 1000
            assert health["status"] == "healthy"
            for f in futs:
                assert len(f.result()["data"][0]["embedding"]) > 0
        print(f"  /health responded in {dt_ms:.1f} ms under 8 concurrent requests")
        PY
      - curl -sf http://localhost:{{.PORT}}/metrics | grep -q 'semembed_batch_size' || (echo "❌ Missing batch_size metric" && exit 1)
      - echo "✅ Concurrency & sub-batching test passed"

  bench:context:
    desc: Measure peak memory and latency per context window (fresh container per window)
    deps: [build]
    vars:
      BENCH_MODEL: '{{.BENCH_MODEL | default "Snowflake/snowflake-arctic-embed-m-long"}}'
      BENCH_PORT: 8089
    cmds:
      - |
        for cap in 512 1024 2048 4096 8192; do
          docker rm -f semembed-bench >/dev/null 2>&1 || true
          docker run -d --name semembed-bench -p {{.BENCH_PORT}}:8081 \
            -e SEMEMBED_MODEL={{.BENCH_MODEL}} -e SEMEMBED_MAX_TOKENS=$cap \
            -v semembed-cache:/home/semembed/.cache/fastembed \
            {{.IMAGE_NAME}}:latest >/dev/null
          for i in $(seq 1 200); do curl -sf http://localhost:{{.BENCH_PORT}}/health >/dev/null && break; sleep 3; done
          python3 - "$cap" <<'PY'
        import json, subprocess, sys, time, urllib.request
        cap = int(sys.argv[1])
        def mem():
            out = subprocess.check_output(["docker", "exec", "semembed-bench", "grep", "-E", "VmRSS|VmHWM", "/proc/1/status"], text=True)
            return {l.split(":")[0]: int(l.split()[1]) // 1024 for l in out.strip().splitlines()}
        def embed(inputs):
            t = time.perf_counter()
            req = urllib.request.Request("http://localhost:{{.BENCH_PORT}}/v1/embeddings",
                data=json.dumps({"input": inputs}).encode(), headers={"Content-Type": "application/json"})
            body = json.loads(urllib.request.urlopen(req, timeout=600).read())
            return body, time.perf_counter() - t
        idle = mem()["VmHWM"]
        text = lambda s: " ".join(f"tok{s}_{i} alpha beta gamma delta epsilon" for i in range(1300))
        for bs in ([1, 4] if cap <= 2048 else [1]):
            body, dt = embed([text(i) for i in range(bs)])
            m = mem()
            print(f"max_tokens={cap} batch={bs} tokens/input={body['usage']['prompt_tokens'] // bs} "
                  f"latency_s={dt:.2f} idle_MiB={idle} peak_MiB={m['VmHWM']}", flush=True)
        PY
        done
        docker rm -f semembed-bench >/dev/null

  test:all:
    desc: Run all tests
    deps: [test:health, test:embed, test:batch, test:models, test:query, test:truncation, test:concurrency]
    cmds:
      - echo "✅ All tests passed"

  # Development tasks
  logs:
    desc: View service logs
    cmds:
      - docker logs -f {{.CONTAINER_NAME}}

  logs:tail:
    desc: Tail last 50 lines of logs
    cmds:
      - docker logs --tail 50 {{.CONTAINER_NAME}}

  shell:
    desc: Open shell in running container
    cmds:
      - docker exec -it {{.CONTAINER_NAME}} /bin/bash

  restart:
    desc: Restart the service
    cmds:
      - docker restart {{.CONTAINER_NAME}}
      - echo "✅ Service restarted"

  stop:
    desc: Stop the service
    cmds:
      - docker stop {{.CONTAINER_NAME}}
      - echo "✅ Service stopped"

  # Metrics and monitoring
  metrics:
    desc: View Prometheus metrics
    cmds:
      - curl -s http://localhost:{{.PORT}}/metrics

  # Clean tasks
  clean:
    desc: Stop and remove container
    cmds:
      - docker rm -f {{.CONTAINER_NAME}} 2>/dev/null || true
      - echo "✅ Container removed"

  clean:image:
    desc: Remove Docker image
    deps: [clean]
    cmds:
      - docker rmi {{.IMAGE_NAME}}:latest 2>/dev/null || true
      - echo "✅ Image removed"

  clean:cache:
    desc: Remove model cache volume
    deps: [clean]
    cmds:
      - docker volume rm semembed-cache 2>/dev/null || true
      - echo "✅ Model cache removed"

  clean:all:
    desc: Clean everything (container, image, cache)
    deps: [clean, clean:image, clean:cache]
    cmds:
      - echo "✅ Complete cleanup finished"

  # Docker Compose integration
  compose:up:
    desc: Start with docker-compose (from semstreams dir)
    dir: ../semstreams
    cmds:
      - docker compose -f docker-compose.services.yml --profile embedding up -d
      - echo "✅ Service started via docker-compose"

  compose:down:
    desc: Stop docker-compose services
    dir: ../semstreams
    cmds:
      - docker compose -f docker-compose.services.yml --profile embedding down
      - echo "✅ Service stopped"

  compose:logs:
    desc: View docker-compose logs
    dir: ../semstreams
    cmds:
      - docker compose -f docker-compose.services.yml logs -f semembed

  # Development workflow shortcuts
  dev:
    desc: Full development cycle (build + run + test)
    cmds:
      - task build
      - task run
      - sleep 5  # Wait for service to start
      - task test:all
      - echo "✅ Development cycle complete"

  dev:rebuild:
    desc: Rebuild and restart service
    cmds:
      - task clean
      - task build:no-cache
      - task run
      - echo "✅ Service rebuilt and running"

  # CI/CD helpers
  ci:test:
    desc: CI test workflow (build + run + test + cleanup)
    cmds:
      - task build
      - task run
      - sleep 10  # Wait for model download
      - task test:all
      - task clean
      - echo "✅ CI tests passed"

  # Help
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  help:
    desc: Show detailed usage guide
    silent: true
    cmds:
      - |
        echo "SemEmbed - Containerized Development Tasks"
        echo ""
        echo "Quick Start:"
        echo "  task dev              # Build, run, and test"
        echo "  task logs             # View service logs"
        echo "  task test:embed       # Test embeddings"
        echo ""
        echo "Build & Run:"
        echo "  task build            # Build Docker image"
        echo "  task run              # Run service (background)"
        echo "  task run:fg           # Run service (foreground)"
        echo "  task run:arctic-xs    # Run with arctic-embed-xs (smaller/faster)"
        echo "  task run:arctic-m     # Run with arctic-embed-m (higher quality)"
        echo "  task run:bge-small    # Run with bge-small (prior default)"
        echo "  task stop             # Stop service"
        echo ""
        echo "Testing:"
        echo "  task test:health      # Health check"
        echo "  task test:embed       # Single embedding test"
        echo "  task test:batch       # Batch embeddings test"
        echo "  task test:all         # All tests"
        echo ""
        echo "Development:"
        echo "  task logs             # Follow logs"
        echo "  task shell            # Open container shell"
        echo "  task restart          # Restart service"
        echo "  task dev:rebuild      # Full rebuild"
        echo ""
        echo "Docker Compose:"
        echo "  task compose:up       # Start with compose"
        echo "  task compose:down     # Stop compose"
        echo "  task compose:logs     # View compose logs"
        echo ""
        echo "Cleanup:"
        echo "  task clean            # Remove container"
        echo "  task clean:all        # Remove everything"
